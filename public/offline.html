<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#163f36" />
    <link rel="icon" href="/icon-192.png" />
    <title>iTrack — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #173c34;
        background: #f6f4ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 20% 10%, #fffdf7 0, transparent 38%),
          #f6f4ee;
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid #d7ddd7;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(22, 63, 54, 0.12);
      }
      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 18px 18px 7px 7px;
        color: #fff7d1;
        background: #163f36;
        font-size: 28px;
      }
      p {
        color: #5c6d67;
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        color: white;
        background: #163f36;
        font: inherit;
        font-weight: 700;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #788782;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Your renewal record is safe.</h1>
      <p>
        iTrack cannot reach the cloud right now. Reconnect to view or
        update your private records and proof files.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <small>
        Account data, APIs, and certificates are never stored in this offline page.
      </small>
    </main>
  </body>
</html>
