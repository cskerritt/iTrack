<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ebe7dc"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f0e0b"
    />
    <link rel="icon" href="/icon-192.png" />
    <title>iTrack — Offline</title>
    <style>
      /*
        This page is served from the cache with no stylesheet of its own, so it
        carries the app's tokens inline. Only the handful the page paints are
        kept, and each is the value app/styles/tokens.css gives it in that scheme —
        no alpha, no haze: the ledger has none. The text clears AA on the card in
        both schemes — 17.1:1 / 13.9:1 for --ink, 6.8:1 / 6.6:1 for --ink-muted —
        as do the button label (15.5:1 / 14.2:1, --on-inverse on --inverse-surface)
        and the mark (7.6:1 / 6.7:1, --accent-on-inverse on --inverse-surface).
        The type stays on the system stack: the woff2 faces are not precached.
      */
      :root {
        color-scheme: light dark;
        font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --paper: #f5f2ea;
        --card: #fffdf8;
        --line: #dad5c8;
        --ink: #1c1a17;
        --ink-muted: #5e5a52;
        --inverse-surface: #1c1a17;
        --on-inverse: #f5f2ea;
        --accent-on-inverse: #93a6ff;
        --shadow: 0 24px 64px rgba(28, 26, 23, 0.16);
        color: var(--ink);
        background: var(--paper);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #15130f;
          --card: #1f1c16;
          --line: #332f27;
          --ink: #ede8dc;
          --ink-muted: #a8a196;
          --inverse-surface: #ede8dc;
          --on-inverse: #1c1a17;
          --accent-on-inverse: #2743b8;
          --shadow: 0 24px 64px rgba(0, 0, 0, 0.62);
        }
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: var(--paper);
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        color: var(--accent-on-inverse);
        background: var(--inverse-surface);
        font-size: 28px;
      }
      p { color: var(--ink-muted); line-height: 1.6; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 10px;
        border: 0;
        border-radius: 8px;
        color: var(--on-inverse);
        background: var(--inverse-surface);
        font: inherit;
        font-weight: 700;
      }
      small { display: block; margin-top: 18px; color: var(--ink-muted); line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Your renewal record is safe.</h1>
      <p>
        iTrack cannot reach the cloud right now. Reconnect to view or
        update your private records and proof files.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <small>
        Account data, APIs, and certificates are never stored in this offline page.
      </small>
    </main>
  </body>
</html>
