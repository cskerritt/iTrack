<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f2f2f7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b0b0e"
    />
    <link rel="icon" href="/icon-192.png" />
    <title>iTrack — Offline</title>
    <style>
      /*
        This page is served from the cache with no stylesheet of its own, so it
        carries the app's tokens inline. Only the handful the page paints are
        kept, and each is the value globals.css gives it in that scheme, with
        two exceptions the app has no flat token for: --card is the app's card
        at 0.92 so the haze behind it shows through, and --glow is the app's
        --page-glow already composited over --paper, because a gradient stop
        here cannot carry an alpha of its own. The text clears AA on the card
        in both schemes — 16.5:1 / 13.4:1 for --ink, 7.3:1 / 8.6:1 for
        --ink-muted, 6.2:1 / 7.3:1 for --ink-faint — as do the button label
        (16.3:1 / 13.8:1) and the mark (6.8:1 / 6.3:1) on --ink-surface.
      */
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          "Segoe UI", Roboto, sans-serif;
        --paper: #f2f2f7;
        --glow: #e2e9f4;
        --card: rgba(255, 255, 255, 0.92);
        --line: #e3e3e8;
        --ink: #1d1d21;
        --ink-muted: #55555e;
        --ink-faint: #5f5f68;
        --ink-surface: #1f2024;
        --on-dark: #ffffff;
        --mark-ink: #5dacff;
        --shadow: 0 24px 70px rgba(47, 47, 51, 0.12);
        color: var(--ink);
        background: var(--paper);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0b0b0e;
          --glow: #16283c;
          --card: rgba(28, 28, 30, 0.92);
          --line: #2c2c30;
          --ink: #e5e5ea;
          --ink-muted: #b8b8c1;
          --ink-faint: #aaaab3;
          --ink-surface: #26262b;
          --on-dark: #f5f5f7;
          --mark-ink: #5dacff;
          --shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          calc(24px + env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 20% 10%, var(--glow) 0, transparent 38%),
          var(--paper);
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 18px 18px 7px 7px;
        color: var(--mark-ink);
        background: var(--ink-surface);
        font-size: 28px;
      }
      p {
        color: var(--ink-muted);
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 10px;
        border: 0;
        border-radius: 999px;
        color: var(--on-dark);
        background: var(--ink-surface);
        font: inherit;
        font-weight: 700;
      }
      small {
        display: block;
        margin-top: 18px;
        color: var(--ink-faint);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Your renewal record is safe.</h1>
      <p>
        iTrack cannot reach the cloud right now. Reconnect to view or
        update your private records and proof files.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <small>
        Account data, APIs, and certificates are never stored in this offline page.
      </small>
    </main>
  </body>
</html>
